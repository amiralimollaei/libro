[project]
name = "libro"
version = "0.1.0"
description = "Libro - Your Personal Library"
readme = "README.md"
authors = [
    { name = "amiralimollaei", email = "me.amiralimollaei@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dataclasses-json>=0.6.7",
    "flet>=0.85.1",
]

[project.scripts]
libro = "libro:main"

[[tool.uv.index]]
url = "https://mirror2.chabokan.net/pypi/simple/"
default = true

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flet-cli>=0.85.1",
    "flet-desktop>=0.85.1",
    "flet-web>=0.85.1",
]

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
org = "io.github.amiralimollaei"
product = "libro"
company = "AmirAli Mollaei"
copyright = "Copyright (C) 2023-2026 by AmirAli Mollaei"

[tool.flet.app]
path = "src"
