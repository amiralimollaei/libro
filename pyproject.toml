[project]
name = "libro"
version = "0.1.0"
description = "Libro - Your Personal Library"
readme = "README.md"
authors = [
    { name = "amiralimollaei", email = "me.amiralimollaei@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dataclasses-json>=0.6.7",
    "flet[all]>=0.85.1",
]

[project.scripts]
libro = "libro:main"

[[tool.uv.index]]
url = "https://mirror2.chabokan.net/pypi/simple/"
default = true

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
